name: Import Media

on:
  workflow_dispatch:
  push:
    paths:
      - "imports/*.json"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import pending media
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          requests=(imports/*.json)

          if [ ${#requests[@]} -eq 0 ]; then
            echo "No import requests."
            exit 0
          fi

          mkdir -p media

          for request in "${requests[@]}"; do
            source_url="$(jq -r '.source_url' "$request")"
            filename="$(jq -r '.filename' "$request")"

            if [ -z "$source_url" ] || [ "$source_url" = "null" ]; then
              echo "Missing source_url in $request" >&2
              exit 1
            fi

            if [ -z "$filename" ] || [ "$filename" = "null" ]; then
              echo "Missing filename in $request" >&2
              exit 1
            fi

            case "$filename" in
              */*|*".."*) echo "Unsafe filename: $filename" >&2; exit 1 ;;
            esac

            echo "Importing $filename..."
            curl --fail --location --silent --show-error --retry 2               "$source_url"               --output "media/$filename"

            test -s "media/$filename"
            rm "$request"
          done

      - name: Commit imported media
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No media changes."
            exit 0
          fi

          git config user.name "sleiman-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media imports
          git commit -m "Import social media asset"
          git push
