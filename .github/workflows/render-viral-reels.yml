name: Render viral reels

on:
  push:
    branches: ["main"]
    paths:
      - "content/viral_week_2026-09-23.json"
      - "scripts/render_viral_week.py"
      - ".github/workflows/render-viral-reels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow

      - name: Render 35 reels
        run: python scripts/render_viral_week.py

      - name: Commit rendered media
        run: |
          git config user.name "sleiman-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/viral-week-2026-09-23
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "Render 35 viral revenue reels"
            git push
          fi
