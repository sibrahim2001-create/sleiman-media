name: Build 0645 voice preview

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-0645-voice-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download Ibrahim warning voice
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://resource2.heygen.ai/text_to_speech/95fe2f05f075434e99f1831f4c60d8e4/a6c8e374b40a4c4eac1182b05ef1bf1e/id=3521dbfe-2721-4a22-9bca-30c92d37150c.wav"
          urllib.request.urlretrieve(url, "/tmp/voice.wav")
          PY
      - name: Build preview
        run: |
          mkdir -p media/previews
          ffmpeg -y             -i media/daily-premium/premium-2026-09-27-01.mp4             -i /tmp/voice.wav             -filter_complex "[1:a]volume=1.15,highpass=f=75,acompressor=threshold=-18dB:ratio=3:attack=5:release=70,alimiter=limit=0.95[a]"             -map 0:v:0 -map "[a]"             -c:v copy -c:a aac -b:a 160k             -shortest -movflags +faststart             media/previews/0645-warning-voice-preview.mp4
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: 0645-warning-voice-preview
          path: media/previews/0645-warning-voice-preview.mp4
          retention-days: 3
