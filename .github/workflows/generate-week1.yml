name: Generate Week 1 Reels

on:
  workflow_dispatch:
  push:
    paths:
      - "content/week1.json"
      - "scripts/generate_week1.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Generate reels
        run: python scripts/generate_week1.py
      - name: Commit generated media
        run: |
          git config user.name "sleiman-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/week1
          if git diff --cached --quiet; then
            echo "No media changes."
            exit 0
          fi
          git commit -m "Generate week 1 reel batch"
          git push
