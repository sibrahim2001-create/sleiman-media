name: Render daily premium reels

on:
  push:
    branches: ["main"]
    paths:
      - "content/daily_premium.json"
      - "scripts/render_daily_premium.py"
      - ".github/workflows/render-daily-premium.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Render premium reels
        run: python scripts/render_daily_premium.py
      - name: Commit media
        run: |
          git config user.name "sleiman-premium-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/daily-premium
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "Render daily premium reels"
            git push
          fi
