name: Render daily premium reels

on:
  push:
    branches: ["main"]
    paths:
      - "content/daily_premium.json"
      - "content/voice_system.json"
      - "scripts/render_daily_premium.py"
      - "scripts/render_attention_v7.py"
      - "scripts/render_attention_v8.py"
      - "scripts/render_attention_v9.py"
      - "scripts/add_voiceovers.py"
      - "scripts/add_voiceovers_v9.py"
      - ".github/workflows/render-daily-premium.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Apply FFmpeg compatibility and pacing fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/render_daily_premium.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("scale=1210:2151", "scale=1210:2150")
          s = s.replace("d=max(1,int(seg*FPS))", "d=max(1,math.ceil(seg*FPS))")
          s = s.replace("d=.08", "d=0.08").replace("d=.3", "d=0.3")
          s = s.replace(
              "segs=[1.75]+[2.05]*(len(pngs)-1)",
              "segs=[2.15]+[2.75]*(len(pngs)-1)"
          )
          p.write_text(s, encoding="utf-8")
          PY
      - name: Render premium reels
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(Path("content/daily_premium.json").read_text(encoding="utf-8"))
          rv=str(data.get("render_version",""))
          script="scripts/render_attention_v9.py" if "attention-v9" in rv else ("scripts/render_attention_v8.py" if "attention-v8" in rv else ("scripts/render_attention_v7.py" if "attention-v7" in rv else "scripts/render_daily_premium.py"))
          print("renderer:", script)
          subprocess.run(["python",script],check=True)
          PY
      - name: Add energetic voiceovers
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.SEC }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(Path("content/daily_premium.json").read_text(encoding="utf-8"))
          rv=str(data.get("render_version",""))
          script="scripts/add_voiceovers_v9.py" if "attention-v9" in rv else "scripts/add_voiceovers.py"
          print("voice mixer:", script)
          subprocess.run(["python",script],check=True)
          PY
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleiman-premium-preview
          path: media/daily-premium/*.mp4
          if-no-files-found: error
          retention-days: 3
      - name: Commit media only
        run: |
          git restore scripts/render_daily_premium.py
          git config user.name "sleiman-premium-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/daily-premium
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "Render premium reels with voiceover"
            git push
          fi
